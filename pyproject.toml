[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-tdse"
version = "0.1.0"
description = "Minimal one-dimensional Crank-Nicolson TDSE solver"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
py-modules = ["tdse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
